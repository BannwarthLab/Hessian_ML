stages:
  - build
  - lint
  - test

build-hessml_image:
  stage: build
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  script:
    - mkdir -p containers
#    - if [ ! -e "containers/${CONTAINER_NAME}.sif" ] ; then apptainer build containers/${CONTAINER_NAME}.sif .gitlab/recipes/${CONTAINER_NAME}.def ; fi
    - apptainer build --force containers/${CONTAINER_NAME}.sif .gitlab/recipes/${CONTAINER_NAME}.def
  tags:
    - shell
  variables:
    CONTAINER_NAME: "hessml_image"

test:
  stage: test
  image: containers/${CONTAINER_NAME}.sif
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  dependencies:
    - build-hessml_image
  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/hessml_image.sif"
    APPTAINER_EXEC_ARGS: "" 
  tags:
    - cpu
  script:  
    - export PYTHON=python3
    - which python3
    - pytest tests/ --cov 


lint:
  stage: lint
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  dependencies:
    - build-hessml_image
  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/hessml_image.sif"
    APPTAINER_EXEC_ARGS: "" 
  tags:
    - cpu
  script:

    - echo $LD_LIBRARY_PATH
    #- /opt/venv/bin/python3 -c "import tblite.interface"
    - /opt/venv/bin/python3 -m venv /tmp/venv 
    - source /tmp/venv/bin/activate
    #- /tmp/venv/bin/python3 -c "import tblite.interface; print('tblite C extension loaded successfully')"
    #- pip install torch
    - export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu/openblas-pthread:$LD_LIBRARY_PATH
    - export CFLAGS="-O2 -march=x86-64 -mtune=generic -mno-avx -mno-avx2"
    - export FFLAGS="-O2 -march=x86-64 -mtune=generic -mno-avx -mno-avx2"
    - export OPENBLAS_CORETYPE=NEHALEM
    - /tmp/venv/bin/pip install --no-binary=tblite --no-cache-dir tblite
    - /tmp/venv/bin/pip install .[dev]
    
    - /tmp/venv/bin/python3 -c "import tblite.interface; print('tblite C extension loaded successfully')"

    # - ruff check .
    # - mypy --ignore-missing-imports --exclude build/ .
    # - codespell src/

