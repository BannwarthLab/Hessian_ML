include:
  - local: .gitlab/common-scripts.yml

stages:
# build the apptainer image this project uses (static deps baked in)
  - build-container
# type checking, spell checking etc.
  - lint
# pytests and upload coverage
  - test
# build the sphinx documentation
  - docs
# publish the built documentation to GitLab Pages
  - deploy

# Registers mlhess itself (fresh from this checkout, --no-deps since the
# static dependency stack is already baked into the image) plus tcgm_lib,
# a private git dependency the image build has no credentials to install.
.mlhess_install:
  script:
    # /opt/venv is baked into the read-only image, so nothing here may
    # `pip install` into it. mlhess is pure Python: just put src/ on
    # PYTHONPATH. tcgm_lib needs installing (private git dep, not baked into
    # the image), so it goes into a writable target dir added to PYTHONPATH.
    - pip install --target=.pydeps "tcgm_lib @ git+https://gitlab.git.nrw/rwth-bannwarthlab/open_tcgm_lib_py.git"
    - export PYTHONPATH="$CI_PROJECT_DIR/src:$CI_PROJECT_DIR/.pydeps:$PYTHONPATH"

.container_vars: &container_vars
  IMAGE_NAME: ""
  CONTAINER_NAME: "RL9-gnu-mlhess-none"
  APPTAINER_RECIPE: "${CONTAINER_NAME}.def"
  APPTAINER_RECIPE_GENERATE_CMD: "python3 .gitlab/generate_mlhess_recipe.py ${CONTAINER_NAME}"

build-mlhess-container:
  stage: build-container
  extends: .build_container
  tags:
    - shell
  variables:
    OS: "RL9"
    COMPILER: "gnu-mlhess"
    GPU: "none"

lint:
  stage: lint
  image: "${CONTAINER_NAME}"
  needs:
    - build-mlhess-container
  before_script:
    - !reference [.mlhess_install, script]
  variables:
    <<: *container_vars
    APPTAINER_EXEC_ARGS: ""
  tags:
    - cpu
  script:
    - ruff check src/
    - mypy --ignore-missing-imports --exclude build/ .
    - codespell src/

test:
  stage: test
  image: "${CONTAINER_NAME}"
  needs:
    - build-mlhess-container
  before_script:
    - !reference [.mlhess_install, script]
  variables:
    <<: *container_vars
    APPTAINER_EXEC_ARGS: "--bind $CI_PROJECT_DIR:$CI_PROJECT_DIR"
    APPTAINER_BIND: "$CI_PROJECT_DIR:$CI_PROJECT_DIR"

  tags:
    - cpu
  script:
    - pytest tests/ --cov=mlhess --cov-report term --cov-report xml:coverage.xml

  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Build documentation
build-docs:
  stage: docs
  image: "${CONTAINER_NAME}"
  needs:
    - build-mlhess-container
  before_script:
    - !reference [.mlhess_install, script]
  variables:
    <<: *container_vars
    APPTAINER_EXEC_ARGS: ""
  tags:
    - cpu
  script:
    - sphinx-build -b html docs docs/_build

  artifacts:
    paths:
      - docs/_build

# Deploy docs
pages: # this job name is fixed
  stage: deploy
  needs:
    - build-docs
  image: alpine:latest
  tags:
    - docker
  script:
    - mkdir -p public
    - mv docs/_build/* public/
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  artifacts:
    paths:
      - public
