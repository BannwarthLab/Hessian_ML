stages:
  - build
  - lint
  - test

build-hessml_image:
  stage: build
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  script:
    - mkdir -p containers
    - if [ ! -e "containers/${CONTAINER_NAME}.sif" ] ; then apptainer build containers/${CONTAINER_NAME}.sif .gitlab/recipes/${CONTAINER_NAME}.def ; fi
    #- apptainer build --force containers/${CONTAINER_NAME}.sif .gitlab/recipes/${CONTAINER_NAME}.def
  tags:
    - shell
  variables:
    CONTAINER_NAME: "hessml_image"

test:
  stage: test
  image: containers/${CONTAINER_NAME}.sif
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  dependencies:
    - build-hessml_image
  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/hessml_image.sif"
    APPTAINER_EXEC_ARGS: "" 
  tags:
    - cpu
  script:  
    - export PYTHON=python3
    - which python3
    - pytest tests/ --cov 


lint:
  stage: lint
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  dependencies:
    - build-hessml_image
  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/hessml_image.sif"
    APPTAINER_EXEC_ARGS: "" 
  tags:
    - cpu
  script:
    - /opt/venv/bin/python3 -c "import tblite.interface"
    - ldd /opt/venv/lib/python3.12/site-packages/tblite/_libtblite*.so
    - /opt/venv/bin/python3 -m venv --system-site-packages /tmp/venv 
    - source /tmp/venv/bin/activate
    - which python3
    - python3 -c "import tblite.interface; print('tblite C extension loaded successfully')"
    - pip install scipy
    # - pip install .[dev]
    # - ruff check .
    # - mypy --ignore-missing-imports --exclude build/ .
    # - codespell src/

