stages:
# generate an image to install some prior packages.
  - build
# install python packages
  - build-env
# type checking, spell checking etc.
  - lint
# pytests and upload coverage
  - test

build-hessml_image:
  stage: build
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  script:
    - mkdir -p containers
    #builds a sif if it is not built yet
    - if [ ! -e "containers/${CONTAINER_NAME}.sif" ] ; then apptainer build containers/${CONTAINER_NAME}.sif .gitlab/recipes/${CONTAINER_NAME}.def ; fi
    #- apptainer build --force containers/${CONTAINER_NAME}.sif .gitlab/recipes/${CONTAINER_NAME}.def

  tags:
    - shell
  variables:
    CONTAINER_NAME: "hessml_image"

build-env:
  stage: build-env
  image: containers/${CONTAINER_NAME}.sif
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
      - /tmp/venv/
      - .cache/pip

  dependencies:
    - build-hessml_image
  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/hessml_image.sif"
    APPTAINER_EXEC_ARGS: ""

  script:
    # generate new venv and install packages
    #- rm -rf /tmp/venv
    - python3 -m venv /tmp/venv
    - source /tmp/venv/bin/activate
    - pip install "numpy>=1.0,<2.0"
    - export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu/openblas-pthread:$LD_LIBRARY_PATH
    - export CFLAGS="-O2 -march=x86-64 -mtune=generic -mno-avx -mno-avx2"
    - export FFLAGS="-O2 -march=x86-64 -mtune=generic -mno-avx -mno-avx2"
    - export OPENBLAS_CORETYPE=NEHALEM
    - /tmp/venv/bin/pip install --no-binary=tblite --no-cache-dir tblite
    - pip install git+https://gitlab+deploy-token-1482:${PRIVATE_DEPLOY_TOKEN}@git.rwth-aachen.de/bannwarthlab/tcgm-lib-py.git
    - /tmp/venv/bin/python3 -c "import tblite.interface; print('tblite C extension loaded successfully')"
    - /tmp/venv/bin/pip install .[dev]

  tags:
    - cpu

lint:
  stage: lint
  image: containers/${CONTAINER_NAME}.sif
  dependencies:
    - build-env
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - /tmp/venv/
      - containers/

  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/hessml_image.sif"
    APPTAINER_EXEC_ARGS: "" 
  tags:
    - cpu
  script:
    - source /tmp/venv/bin/activate
    - ruff check .
    - mypy --ignore-missing-imports --exclude build/ .
    - codespell src/

test:
  stage: test
  image: containers/${CONTAINER_NAME}.sif
  dependencies:
    - build-env
  cache:
    key: "hessml_image-$CI_COMMIT_REF_SLUG"
    paths:
      - /tmp/venv/
      - containers/

  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/hessml_image.sif"
    APPTAINER_EXEC_ARGS: "--bind $CI_PROJECT_DIR:$CI_PROJECT_DIR" 
    APPTAINER_BIND: "$CI_PROJECT_DIR:$CI_PROJECT_DIR"

  tags:
    - cpu
  script:  
    - source /tmp/venv/bin/activate
    - pytest tests/ --cov=hessian_ml --cov-report term --cov-report=xml:$CI_PROJECT_DIR/coverage.xml

  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml