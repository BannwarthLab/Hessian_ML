image: python:3.11
stages:
  - test
  - lint
  
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/venv/pip"

cache:
  paths:
    - venv/
    - .cache/pip

before_script:
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip setuptools wheel

  # Install compilers and runtime libraries
  - apt-get update
  - apt-get install -y gfortran-13 build-essential libopenblas-dev pkg-config libgfortran5

  # Make gfortran available as 'gfortran'
  - ln -s /usr/bin/gfortran-13 /usr/bin/gfortran

  # Set runtime library path
  - export LD_LIBRARY_PATH=/usr/lib/gcc/x86_64-linux-gnu/13:$LD_LIBRARY_PATH

  # Install tblite from source so it uses gfortran
  - pip install --no-binary=tblite --no-cache-dir tblite

  # Verify import
  - python -c "import tblite.interface; print('tblite C extension loaded OK')"


  - pip install git+https://gitlab+deploy-token-1478:${PRIVATE_DEPLOY_TOKEN}@git.rwth-aachen.de/bannwarthlab/tcgm-lib-py.git
  - pip install .[dev] ruff mypy codespell pytest pytest-cov types-requests types-PyYAML

lint:
  stage: lint
  script:
    - source venv/bin/activate
    - ruff check .
    - mypy --ignore-missing-imports --exclude build/ .
    - codespell src/
  tags:
    - docker

test:
  stage: test
  script:
    - source venv/bin/activate
    - python -c "import tblite.interface; print('tblite import OK')"
    - pytest tests/ --cov
  tags:
    - docker