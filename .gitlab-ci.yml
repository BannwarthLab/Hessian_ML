image: python:3.11

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt
  
tags:
  - docker

lint:

  stage: lint
  script:
    - ruff check .
    - mypy .
    
test:
  script:
    - pip install .[dev]
    - pytest
    - mypy
    - codespell