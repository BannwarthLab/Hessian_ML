stages:
  - build
  - lint
  - test

default:
  before_script:
    # Show info about Apptainer and build the image remotely
    - apptainer info
    - apptainer build --remote mlhess_image.sif mlhess_image.def

build-image:
  stage: build
  artifacts:
    paths:
      - mlhess_image.sif  # your built Apptainer image
  script:
    - echo "Image built as mlhess_image.sif"

cache:
  paths:
    - venv/
    - .cache/pip

lint:
  stage: lint
  script:
    # Activate venv if needed (optional if image already has Python deps)
    - source venv/bin/activate || echo "venv not found, skipping"
    # Run linters
    - apptainer exec myimage.sif ruff check .
    - apptainer exec myimage.sif mypy --ignore-missing-imports --exclude build/ .
    - apptainer exec myimage.sif codespell src/

test:
  stage: test
  script:
    - source venv/bin/activate || echo "venv not found, skipping"
    - apptainer exec myimage.sif python -c "import tblite.interface; print('tblite import OK')"
    - apptainer exec myimage.sif pytest tests/ --cov
  tags:
    - docker