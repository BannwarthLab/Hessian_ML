image: python:3.11

stages:
  - test
  - lint
  
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/venv/pip"

cache:
  paths:
    - venv/
    - .cache/pip

before_script:
  - pip install --upgrade pip
  - python -m venv venv
  - source venv/bin/activate
  - apt-get update
  - apt-get install -y gcc-13 gfortran-13 build-essential libopenblas-dev pkg-config

  - export CC=gcc-13
  - export FC=gfortran-13
  - export F77=gfortran-13
  - export LDFLAGS="-lgfortran"

  - gfortran --version
  - ldd venv/lib/python3.11/site-packages/tblite/_libtblite*.so | grep gfortran

  - pip install git+https://gitlab+deploy-token-1478:${PRIVATE_DEPLOY_TOKEN}@git.rwth-aachen.de/bannwarthlab/tcgm-lib-py.git
  - pip install --no-binary=tblite --no-cache-dir tblite   
  - python -c "import tblite.interface"
  - pip install .[dev] ruff mypy codespell pytest pytest-cov types-requests types-PyYAML

lint:
  stage: lint
  script:
    - source venv/bin/activate
    - ruff check .
    - mypy --ignore-missing-imports --exclude build/ .
    - codespell src/
  tags:
    - docker

test:
  stage: test
  script:
    - source venv/bin/activate
    - python -c "import tblite.interface; print('tblite import OK')"
    - pytest tests/ --cov
  tags:
    - docker