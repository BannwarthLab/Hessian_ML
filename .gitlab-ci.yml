name: CI/CD Pipeline

steps:
  - uses: actions/checkout@v3

  - name: Set up Apptainer
    run: sudo apt-get update && sudo apt-get install -y apptainer

  - name: Build Apptainer image
    run: apptainer build mlhess_image.sif mlhess_image.def

  - name: Run linting
    run: |
      apptainer exec mlhess_image.sif ruff check .
      apptainer exec mlhess_image.sif mypy --ignore-missing-imports --exclude build/ .
      apptainer exec mlhess_image.sif codespell src/

  - name: Run tests
    run: |
      apptainer exec mlhess_image.sif pytest tests/ --cov