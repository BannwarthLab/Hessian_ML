image: python:3.11

stages:
  - setup
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

setup:
  stage: setup
  script:
    - pip install --upgrade pip
    - python -m venv venv
    - source venv/bin/activate
    - pip install .[dev] ruff mypy codespell pytest types-requests types-PyYAML
  artifacts:
    paths:
      - /usr/local/lib/python3.11/site-packages
    expire_in: 1h
  tags:
    - docker

lint:
  stage: lint
  dependencies:
    - setup
  script:
    - ruff check .
    - mypy --ignore-missing-imports --exclude build/ .
    - codespell
  tags:
    - docker

test:
  stage: test
  dependencies:
    - setup
  script:
    - pytest
  tags:
    - docker