stages:
  - build
  - test
  - lint
  
cache:
  paths:
    - venv/
    - .cache/pip

build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t registry.gitlab.com/$CI_PROJECT_PATH:latest .
    - docker push registry.gitlab.com/$CI_PROJECT_PATH:latest
    
before_script:
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip setuptools wheel


  - apt-get update
  - apt-get install -y --no-install-recommends gfortran build-essential libopenblas-dev pkg-config libgfortran5

  - pip install --no-binary=tblite --no-cache-dir tblite

  - python -c "import tblite.interface; print('tblite C extension loaded OK')"


  - pip install git+https://gitlab+deploy-token-1478:${PRIVATE_DEPLOY_TOKEN}@git.rwth-aachen.de/bannwarthlab/tcgm-lib-py.git
  - pip install .[dev] ruff mypy codespell pytest pytest-cov types-requests types-PyYAML

lint:
  stage: lint
  image: registry.gitlab.com/$CI_PROJECT_PATH:latest
  script:
    - source venv/bin/activate
    - ruff check .
    - mypy --ignore-missing-imports --exclude build/ .
    - codespell src/
  tags:
    - docker

test:
  stage: test
  image: registry.gitlab.com/$CI_PROJECT_PATH:latest
  script:
    - source venv/bin/activate
    - python -c "import tblite.interface; print('tblite import OK')"
    - pytest tests/ --cov
  tags:
    - docker