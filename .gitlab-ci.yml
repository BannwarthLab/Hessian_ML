image: python:3.11

stages:
  - test
  - lint
  
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/venv/pip"

cache:
  paths:
    - venv/
    - .cache/pip

before_script:
  - pip install --upgrade pip
  - python -m venv venv
  - source venv/bin/activate
  - pip install git+https://gitlab+deploy-token-1478:${PRIVATE_DEPLOY_TOKEN}@git.rwth-aachen.de/bannwarthlab/tcgm-lib-py.git
  - pip install .[dev] ruff mypy codespell pytest pytest-cov types-requests types-PyYAML
  - pip uninstall -y tblite
  - pip install --no-cache-dir --force-reinstall tblite
  - apt-get update
  - apt-get install -y gcc gfortran build-essential python3-dev

lint:
  stage: lint
  script:
    - source venv/bin/activate
    - ruff check .
    - mypy --ignore-missing-imports --exclude build/ .
    - codespell src/
  tags:
    - docker

test:
  stage: test
  script:
    - source venv/bin/activate
    - pip show tblite
    - pytest tests/ --cov
  tags:
    - docker